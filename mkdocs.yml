site_name: Developer Day November 2026
site_description: Developer Day November 2026
site_url: https://codess-aus.github.io/Developer-Day-November-2026/
repo_url: https://github.com/codess-aus/Developer-Day-November-2026
repo_name: Developer-Day-November-2026

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Two palettes give us the light/dark switch. Material remembers the choice
  # in localStorage and defaults to the visitor's OS preference.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs        # chapters become top tabs on wide screens
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true

